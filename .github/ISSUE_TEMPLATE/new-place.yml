name: New place
description: Add a recommendation to Foodieverse
title: "New place"
body:
  - type: markdown
    attributes:
      value: |
        Paste the Google Maps link and write your recommendation, then pick the vibe and when to go.
        You'll get a preview as a comment. Reply **yes** to publish, or reply with corrections ("make it fancy", "remove expensive").
  - type: input
    id: maps
    attributes:
      label: Google Maps link
      placeholder: https://maps.app.goo.gl/...
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Your recommendation
      description: In your own words.
    validations:
      required: true
  - type: dropdown
    id: vibe
    attributes:
      label: Vibe
      description: How the place feels. If you leave it on "Ask me", the preview will ask.
      options:
        - Ask me
        - Cheap
        - Casual
        - Fancy
      default: 0
  - type: checkboxes
    id: serves
    attributes:
      label: When to go
      description: Pick one or more. If you pick none, the preview will ask.
      options:
        - label: Breakfast / brunch
        - label: Coffee shop
        - label: Lunch
        - label: Dinner
        - label: Cocktails
        - label: Beer / Wine
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional, comma-separated. Leave empty to let the AI choose.
      placeholder: natural-wine, date-night
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: Optional. Drag or paste your own photos here (JPEG or PNG).
  - type: input
    id: hint
    attributes:
      label: Place name and city
      description: Only needed if the link isn't recognised, e.g. "Bar Vivant, Copenhagen".
  - type: checkboxes
    id: options
    attributes:
      label: Text
      options:
        - label: Publish my text exactly as written (no AI edits)
